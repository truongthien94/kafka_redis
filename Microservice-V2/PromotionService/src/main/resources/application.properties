spring.application.name=promotion-service

# -----------------------
# Database
# -----------------------
spring.datasource.url=jdbc:mysql://localhost:3306/promotion?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=duc123
server.port=8082

# -----------------------
# Naming entity mapping table in SQL
# -----------------------
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# -----------------------
# Show sql
# -----------------------
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

#Redis
data.redis.host=localhost
data.redis.port=

#Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/